<link rel="canonical" href="https://toolbox.lucke.jp/apps.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="個人事業主の道具箱">
<meta property="og:title" content="ほかのアプリ一覧 - 個人事業主の道具箱">
<meta property="og:description" content="食品表示・HACCP・テイクアウト予約・在庫管理・簿記などのアプリ一覧">
<meta property="og:url" content="https://toolbox.lucke.jp/apps.html">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231e6b52%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22white%22%3E%E9%81%93%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<main class="wrap">
<h1>ほかのアプリ一覧</h1>
<p class="lead">「個人事業主の道具箱」の運営者が作っている、ほかのアプリです。お店の業務や毎日のくらしに役立つものを集めています。</p>
<div id="apps"></div>
<div class="ad-slot">広告スペース</div>
<h2>道具箱のツール</h2>
<div id="related"></div>
</main>
<script src="assets/common.js"></script>
<script src="assets/apps.js"></script>
<script>
(function(){
  var box = document.getElementById('apps'), cats = [];
  (window.APPS || []).forEach(function(a){ if (cats.indexOf(a.cat || 'その他') < 0) cats.push(a.cat || 'その他'); });
  box.innerHTML = cats.map(function(c){
    return '<h2>'+esc(c)+'</h2><div class="apps">' + APPS.filter(function(a){ return (a.cat || 'その他') === c; }).map(function(a){
      var host = a.url.replace(/^https?:\/\//,'').replace(/\/$/,'');
      var img = a.thumb || ('https://s.wordpress.com/mshots/v1/' + encodeURIComponent(a.url) + '?w=800&h=500');
      return '<a class="appcard" data-app="'+esc(host.split('.')[0])+'" href="'+esc(a.url)+'" target="_blank" rel="noopener">' +
        '<div class="thumb" data-initial="'+esc(a.name.charAt(0))+'"><img src="'+esc(img)+'" alt="'+esc(a.name)+'のトップページ" loading="lazy" width="800" height="500" onerror="this.remove()"></div>' +
        '<div class="body"><div class="t">'+esc(a.name)+'</div><div class="d">'+esc(a.desc || '')+'</div><div class="u">'+esc(host)+' ↗</div></div></a>';
    }).join('') + '</div>';
  }).join('');
})();
</script>
</body></html>
